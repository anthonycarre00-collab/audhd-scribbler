<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Audhd Scribbler</title>
<style>
/* === TOKENS === */
:root {
  --paper:#FAF7F2; --panel:#FFFFFF; --ink:#2E2A26; --muted:#7A7268;
  --line:#E8E2D6; --soft:#F2EDE3;
  --inbox-accent:#6B8E7F; --inbox-soft:#E8EFE9; --inbox-deep:#4A6B5C;
  --ms-accent:#C89B6B; --ms-soft:#F5EBDD; --ms-deep:#8E6A42;
  --success:#7A9B7E; --warning:#D4A574; --info:#8FA4B0; --danger:#B07A6A;
  --shadow:0 1px 3px rgba(46,42,38,0.06),0 1px 2px rgba(46,42,38,0.04);
  --shadow-lg:0 4px 12px rgba(46,42,38,0.08),0 2px 4px rgba(46,42,38,0.04);
  --r-sm:8px; --r-md:10px; --r-lg:14px;
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-2xl:48px;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
  --font-heading:'Source Serif 4',Georgia,serif;
  --font-mono:'JetBrains Mono',Consolas,monospace;
}
/* === BASE === */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:16px;line-height:1.6;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-heading);font-weight:600;line-height:1.3}
h1{font-size:30px} h2{font-size:22px} h3{font-size:18px}
.muted{color:var(--muted)}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-lg);flex-shrink:0}
.brand{font-family:var(--font-heading);font-size:20px;font-weight:600}
.header-actions{display:flex;align-items:center;gap:var(--sp-md)}
.status-dot{font-size:10px;color:var(--success)} .status-text{font-size:13px;color:var(--muted)}
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:var(--soft);border-right:1px solid var(--line);padding:var(--sp-lg) var(--sp-sm);display:flex;flex-direction:column;flex-shrink:0}
.sidebar nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:var(--sp-sm);width:100%;border:none;background:transparent;text-align:left;padding:11px 12px;border-radius:var(--r-sm);color:var(--ink);cursor:pointer;font-size:15px;font-family:var(--font-body);transition:background 0.15s}
.nav-item:hover{background:var(--line)} .nav-item.active{background:var(--inbox-soft);color:var(--inbox-deep);font-weight:500}
.nav-item.active[data-view="manuscript"]{background:var(--ms-soft);color:var(--ms-deep)}
.nav-count{margin-left:auto;font-size:12px;color:var(--muted);background:var(--panel);padding:1px 6px;border-radius:10px}
.sidebar-footer{font-size:11px;color:var(--muted);padding:var(--sp-sm)}
.content{flex:1;overflow-y:auto;padding:var(--sp-xl);max-width:1100px;margin:0 auto;width:100%}
.view{display:none} .view.active{display:block}
.view-header{margin-bottom:var(--sp-lg)} .view-header h1{margin-bottom:4px} .view-header .lead{color:var(--muted);max-width:700px}
.zone-inbox h1{color:var(--inbox-deep)} .zone-inbox .view-header{border-bottom:2px solid var(--inbox-accent);padding-bottom:var(--sp-md)}
.zone-manuscript h1{color:var(--ms-deep)} .zone-manuscript .view-header{border-bottom:2px solid var(--ms-accent);padding-bottom:var(--sp-md)}
/* === COMPONENTS === */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:14px 24px;border-radius:var(--r-md);cursor:pointer;font-family:var(--font-body);font-size:15px;font-weight:600;transition:background 0.15s,border-color 0.15s;min-height:44px}
.btn:hover{border-color:var(--muted)} .btn-primary{background:var(--inbox-accent);border-color:var(--inbox-accent);color:#fff}
.zone-manuscript .btn-primary{background:var(--ms-accent);border-color:var(--ms-accent)}
.btn-primary:hover{opacity:0.9} .btn-secondary{background:var(--panel);border-color:var(--inbox-accent);color:var(--inbox-deep)}
.zone-manuscript .btn-secondary{border-color:var(--ms-accent);color:var(--ms-deep)}
.btn-ghost{background:transparent;border:none;color:var(--muted);padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;min-height:36px}
.btn-ghost:hover{color:var(--ink)} .btn:disabled{opacity:0.5;cursor:default}
.btn-sm{padding:8px 14px;font-size:13px;min-height:36px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-lg);margin-bottom:var(--sp-lg);box-shadow:var(--shadow)}
.card h3{margin-bottom:var(--sp-sm)} .card .muted{font-size:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-md);margin:var(--sp-lg) 0}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-md)}
.dropzone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:40px;text-align:center;cursor:pointer;transition:background 0.2s,border-color 0.2s;margin-bottom:var(--sp-lg)}
.dropzone:hover{background:var(--soft);border-color:var(--muted)}
.dropzone.dragover{background:var(--inbox-soft);border-color:var(--inbox-accent);border-style:solid}
.dropzone-icon{font-size:32px;margin-bottom:var(--sp-sm)} .dropzone-text{font-size:17px;font-weight:600} .dropzone-hint{font-size:14px;color:var(--muted);margin-top:4px}
.filelist{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);overflow:hidden}
.filerow{display:flex;align-items:center;gap:var(--sp-sm);padding:12px var(--sp-md);border-bottom:1px solid var(--line)}
.filerow:last-child{border-bottom:none} .filerow input[type="checkbox"]{width:18px;height:18px;flex-shrink:0}
.filerow .file-info{flex:1} .filerow .file-name{font-weight:500} .filerow .file-meta{font-size:12px;color:var(--muted)}
.filerow .file-folder{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.btn-delete{font-size:11px;padding:5px 10px;border:1px solid #e0c8c0;background:#fff5f3;color:#a05050;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.btn-delete:hover{background:#f0e0dc}
.actions{display:flex;gap:var(--sp-sm);flex-wrap:wrap;margin:var(--sp-md) 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-block;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500}
.chip-theme{background:var(--inbox-soft);color:var(--inbox-deep);border:1px solid var(--inbox-accent)}
.chip-character{background:var(--ms-soft);color:var(--ms-deep);border:1px solid var(--ms-accent)}
.chip-place{background:#E8EFF5;color:#4A6B8E;border:1px solid #8FA4B0}
.chip-sensory{background:#F5EFE8;color:#8E7A42;border:1px solid #D4A574}
.result-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-lg);margin-bottom:var(--sp-md)}
.result-head{display:flex;justify-content:space-between;gap:var(--sp-md);align-items:start;margin-bottom:var(--sp-sm)}
.result-badge{font-size:10px;padding:3px 8px;border-radius:10px;background:var(--soft);color:var(--muted)}
.finding{margin-top:var(--sp-sm);padding:var(--sp-md);background:var(--soft);border-radius:var(--r-sm)}
.finding strong{display:block;margin-bottom:4px}
.kv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-sm);margin-top:var(--sp-md)}
.kv-item{background:var(--paper);border-radius:var(--r-sm);padding:var(--sp-sm)}
.kv-label{display:block;color:var(--muted);font-size:11px} .kv-value{font-size:16px;font-weight:600}
.json-viewer{margin-top:var(--sp-sm);background:var(--ink);color:#d4d0c8;border-radius:var(--r-sm);padding:var(--sp-md);white-space:pre-wrap;font-family:var(--font-mono);font-size:13px;max-height:300px;overflow:auto}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:var(--sp-sm)}
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-sm)}
.tool-card{display:flex;gap:var(--sp-sm);align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-md);background:var(--panel);cursor:pointer}
.tool-card.selected{background:var(--ms-soft);border-color:var(--ms-accent)}
.tool-card input{margin-top:4px} .tool-body{flex:1} .tool-title{font-weight:600;font-size:14px} .tool-meta{font-size:11px;color:var(--muted);margin-top:2px}
.notice{padding:var(--sp-md);border-radius:var(--r-sm);background:var(--soft);margin:var(--sp-md) 0;font-size:14px}
.empty{text-align:center;padding:var(--sp-2xl);color:var(--muted)}
.toast{position:fixed;bottom:var(--sp-lg);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 24px;border-radius:var(--r-md);font-size:14px;z-index:1000;box-shadow:var(--shadow-lg);transition:opacity 0.3s}
.note-title-input{width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);font-family:var(--font-body);font-size:15px;margin-bottom:var(--sp-sm)}
/* === TIMERS === */
.thinking-overlay{position:fixed;inset:0;background:rgba(46,42,38,0.12);display:flex;align-items:center;justify-content:center;z-index:500}
.thinking-card{background:var(--panel);border-radius:var(--r-lg);padding:var(--sp-2xl);max-width:480px;width:90%;text-align:center;box-shadow:var(--shadow-lg)}
.thinking-title{font-family:var(--font-heading);font-size:24px;font-weight:600;color:var(--ink);margin-bottom:4px}
.thinking-step{font-size:14px;color:var(--muted);margin-bottom:var(--sp-xl)}
.thinking-timer{font-family:var(--font-mono);font-size:56px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.thinking-timer-label{font-size:13px;color:var(--muted);margin-top:4px;margin-bottom:var(--sp-lg)}
.thinking-dot{width:10px;height:10px;border-radius:50%;background:var(--inbox-accent);margin:0 auto var(--sp-md);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1.0}}
.thinking-message{font-size:16px;font-style:italic;color:var(--muted);margin-bottom:var(--sp-xl);min-height:24px;transition:opacity 0.4s}
.thinking-cancel{margin-top:var(--sp-md)}
.note-overlay{position:fixed;inset:0;background:rgba(46,42,38,0.12);display:flex;justify-content:flex-end;z-index:500}
.note-panel{background:var(--panel);width:400px;height:100%;padding:var(--sp-lg);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.note-panel h3{margin-bottom:var(--sp-md)}
.note-body-input{flex:1;width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);font-family:var(--font-body);font-size:15px;resize:none;min-height:200px}
.note-actions{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp-md)}
.note-autosave{font-size:12px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.thinking-dot{animation:none;opacity:0.7}.thinking-message{transition:none}*{transition:none!important;animation:none!important}}
*:focus-visible{outline:2px solid var(--inbox-accent);outline-offset:2px}
.zone-manuscript *:focus-visible{outline-color:var(--ms-accent)}
button{user-select:none}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">✎ Audhd Scribbler</div>
    <div class="header-actions">
      <button class="btn-ghost" onclick="openQuickNote()">✎ Quick Note</button>
      <span class="status-dot" id="statusDot">●</span>
      <span class="status-text" id="statusText">Ready</span>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav>
        <button class="nav-item active" data-view="home" onclick="navigate('home')">◌ Home</button>
        <button class="nav-item" data-view="inbox" onclick="navigate('inbox')">✉ Inbox <span class="nav-count" id="inboxCount"></span></button>
        <button class="nav-item" data-view="manuscript" onclick="navigate('manuscript')">📄 Manuscript <span class="nav-count" id="msCount"></span></button>
        <button class="nav-item" data-view="search" onclick="navigate('search')">🔍 Search</button>
        <button class="nav-item" data-view="exports" onclick="navigate('exports')">⬇ Export</button>
        <button class="nav-item" data-view="settings" onclick="navigate('settings')">⚙ Settings</button>
      </nav>
      <div class="sidebar-footer">v5.0 · local</div>
    </aside>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="thinking-overlay" id="thinkingOverlay" style="display:none">
  <div class="thinking-card">
    <h2 class="thinking-title" id="thinkingTitle">Working…</h2>
    <div class="thinking-step" id="thinkingStep"></div>
    <div class="thinking-timer" id="thinkingTimer">00:00</div>
    <div class="thinking-timer-label">elapsed</div>
    <div class="thinking-dot" id="thinkingDot"></div>
    <div class="thinking-message" id="thinkingMessage">Reading your words carefully…</div>
    <button class="btn-ghost thinking-cancel" onclick="cancelOperation()">Stop — your work is saved</button>
  </div>
</div>
<div class="note-overlay" id="noteOverlay" style="display:none">
  <div class="note-panel">
    <h3>✎ Quick Note</h3>
    <input type="text" class="note-title-input" id="noteTitle" placeholder="Title (optional)">
    <textarea class="note-body-input" id="noteBody" placeholder="Write the thought here…"></textarea>
    <div class="note-actions"><span class="note-autosave" id="noteAutosave"></span><button class="btn-primary" onclick="saveNote()">Save to Inbox</button></div>
  </div>
</div>
<div class="toast" id="toast" style="display:none"></div>
<script>
var DATA={files:[],tools:{},catalog:{}},currentView='home',operationCancelled=false,timerInterval=null,timerStart=null,messageInterval=null;
var calmingMessages=["Reading your words carefully…","Looking for patterns…","This is the slow, careful part.","Thank you for waiting.","Almost there…"];
var apiReady=false;
window.addEventListener('pywebviewready',function(){apiReady=true;load()});
function waitForApi(){return new Promise(function(r){if(apiReady)return r();window.addEventListener('pywebviewready',function(){r()})})}
async function call(method){await waitForApi();var args=[].slice.call(arguments,1);try{return await window.pywebview.api[method].apply(window.pywebview.api,args)}catch(e){console.error('API '+method+' failed:',e);throw new Error(e.message||String(e))}}
async function load(){try{var s=await call('get_status');document.getElementById('statusText').textContent=s.llm||'Ready';document.getElementById('statusDot').style.color=s.ok?'var(--success)':'var(--danger)';var f=await call('list_files');DATA.files=f.files||[];var t=await call('get_tools');DATA.tools=t.tools||{};DATA.catalog=t.catalog||{};updateNavCounts();if(currentView)navigate(currentView)}catch(e){setStatus('Could not load: '+e.message)}}
function updateNavCounts(){var i=DATA.files.filter(function(f){return['raw-dumps','triage'].includes(f.folder)}).length;var m=DATA.files.filter(function(f){return['chapters','drafts','final'].includes(f.folder)}).length;document.getElementById('inboxCount').textContent=i||'';document.getElementById('msCount').textContent=m||''}
function navigate(v){currentView=v;document.querySelectorAll('.nav-item').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});var c=document.getElementById('content');c.className='content';if(v==='inbox')c.classList.add('zone-inbox');if(v==='manuscript')c.classList.add('zone-manuscript');if(v==='home')renderHome();if(v==='inbox')renderInbox();if(v==='manuscript')renderManuscript();if(v==='search')renderSearch();if(v==='exports')renderExports();if(v==='settings')renderSettings()}
function setStatus(t){document.getElementById('statusText').textContent=t}
function showToast(t,d){d=d||3000;var el=document.getElementById('toast');el.textContent=t;el.style.display='block';el.style.opacity='1';setTimeout(function(){el.style.opacity='0';setTimeout(function(){el.style.display='none'},300)},d)}
function startTimer(title){operationCancelled=false;document.getElementById('thinkingOverlay').style.display='flex';document.getElementById('thinkingTitle').textContent=title||'Working…';document.getElementById('thinkingStep').textContent='';document.getElementById('thinkingTimer').textContent='00:00';document.getElementById('thinkingMessage').textContent=calmingMessages[0];timerStart=Date.now();var mi=0;timerInterval=setInterval(function(){var e=Math.floor((Date.now()-timerStart)/1000);var mm=String(Math.floor(e/60)).padStart(2,'0');var ss=String(e%60).padStart(2,'0');document.getElementById('thinkingTimer').textContent=mm+':'+ss},1000);messageInterval=setInterval(function(){mi=(mi+1)%calmingMessages.length;var el=document.getElementById('thinkingMessage');el.style.opacity='0';setTimeout(function(){el.textContent=calmingMessages[mi];el.style.opacity='1'},400)},8000)}
function updateTimerStep(s,t,m){if(t>1)document.getElementById('thinkingStep').textContent='Step '+s+' of '+t+' · '+m;else document.getElementById('thinkingStep').textContent=m}
function stopTimer(){clearInterval(timerInterval);clearInterval(messageInterval);document.getElementById('thinkingOverlay').style.display='none'}
function cancelOperation(){operationCancelled=true;stopTimer();setStatus('Stopped. Your work is saved.')}
window.__scribblerProgress__=function(s,t,m){updateTimerStep(s,t,m)};
function esc(s){return String(s??'').replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function renderHome(){var i=DATA.files.filter(function(f){return['raw-dumps','triage'].includes(f.folder)});var m=DATA.files.filter(function(f){return['chapters','drafts','final'].includes(f.folder)});var u=i.filter(function(f){return f.status==='unindexed'}).length;var sug='';if(u>0)sug='<div class="card"><h3>Suggested next</h3><p class="muted">You have '+u+' untagged brain dump(s).</p><button class="btn-primary" onclick="navigate(\'inbox\')">Preview tags</button></div>';else if(m.length>0)sug='<div class="card"><h3>Suggested next</h3><p class="muted">'+m.length+' manuscript file(s) ready for analysis.</p><button class="btn-primary" onclick="navigate(\'manuscript\')">Open Analysis</button></div>';else sug='<div class="card"><h3>Suggested next</h3><p class="muted">Drop brain dumps into the Inbox to get started.</p><button class="btn-primary" onclick="navigate(\'inbox\')">Open Inbox</button></div>';document.getElementById('content').innerHTML='<div class="view active"><div class="view-header"><h1>Your writing workshop</h1><p class="lead">Two separate worlds: <b>Inbox</b> for messy material and tagging; <b>Manuscript</b> for drafts and analysis.</p></div><div class="grid-3"><div class="card"><h3>01 · Inbox</h3><p class="muted">'+i.length+' file(s)</p><p>Brain dumps, fragments, notes.</p><button class="btn-secondary" onclick="navigate(\'inbox\')">Open Inbox</button></div><div class="card"><h3>02 · Manuscript</h3><p class="muted">'+m.length+' file(s)</p><p>Chapters and drafts for analysis.</p><button class="btn-secondary" onclick="navigate(\'manuscript\')">Open Manuscript</button></div><div class="card"><h3>03 · Search</h3><p>Find scenes by character, place, or theme.</p><button class="btn-secondary" onclick="navigate(\'search\')">Open Search</button></div></div>'+sug+'</div>'}
function renderFileList(files,scope){if(!files.length)return'<div class="empty">Nothing here yet.</div>';return files.map(function(f){return'<div class="filerow"><input type="checkbox" data-s="'+scope+'" value="'+esc(f.path)+'"><div class="file-info"><div class="file-name">'+esc(f.filename)+'</div><div class="file-meta">'+(f.word_count||0)+' words · '+esc(f.status)+(f.last_analyzed?' · analysed':'')+'</div></div><span class="file-folder">'+esc(f.folder)+'</span><button class="btn-delete" onclick="deleteFile(\''+esc(f.path)+'\')">Delete</button></div>'}).join('')}
function selected(scope){return[].slice.call(document.querySelectorAll('input[data-s="'+scope+'"]:checked')).map(function(x){return x.value})}
function renderInbox(){var files=DATA.files.filter(function(f){return['raw-dumps','triage'].includes(f.folder)});document.getElementById('content').innerHTML='<div class="view active zone-inbox"><div class="view-header"><h1>Scribble Inbox</h1><p class="lead">Brain dumps, fragments, notes. Nothing here is treated as a manuscript.</p></div><div class="dropzone" onclick="importFiles(\'raw-dumps\')"><div class="dropzone-icon">📂</div><div class="dropzone-text">Drop .txt or .md files here</div><div class="dropzone-hint">or click to browse</div></div><div class="card"><h3>Your brain dumps</h3><div class="filelist" id="inboxList">'+renderFileList(files,'inbox')+'</div></div><div class="actions"><button class="btn-secondary" onclick="previewTags()">Preview tags</button><button class="btn-primary" onclick="applyTags()">Apply tags to selected</button></div><div class="card" id="tagResults" style="display:none"><h3>Tagging results</h3><div id="tagResultsContent"></div></div></div>';var dz=document.querySelector('.dropzone');dz.ondragover=function(e){e.preventDefault();dz.classList.add('dragover')};dz.ondragleave=function(){dz.classList.remove('dragover')};dz.ondrop=async function(e){e.preventDefault();dz.classList.remove('dragover');var paths=[].slice.call(e.dataTransfer.files).map(function(f){return f.path});if(paths.length)await doImport('raw-dumps',paths)}}
async function importFiles(dest){try{var r=await call('pick_open_files');if(r&&r.paths&&r.paths.length)await doImport(dest,r.paths);else if(r&&r.error)showToast(r.error)}catch(e){showToast('Could not open file dialog: '+e.message)}}
async function doImport(dest,paths){setStatus('Importing…');var r=await call('import_files',dest,paths);if(r.ok){showToast(r.message);await load()}else showToast(r.error||'Import failed')}
async function previewTags(){var p=selected('inbox');if(!p.length)return showToast('Select one or more brain dumps first');startTimer('Previewing tags');var r=await call('tag_preview',p,false);stopTimer();if(r.ok){var c=r.preview.map(function(p){return'<div class="result-card"><div class="result-head"><div><h3>'+esc(p.filename)+'</h3></div></div><div class="kv-grid"><div class="kv-item"><span class="kv-label">Voice</span><strong>'+esc(p.voice||'—')+'</strong></div><div class="kv-item"><span class="kv-label">Era</span><strong>'+esc(p.era||'—')+'</strong></div><div class="kv-item"><span class="kv-label">Emotion</span><strong>'+esc(p.emotional_register||'—')+'</strong></div></div><div style="margin-top:12px"><strong>Themes</strong><div class="chips">'+(p.themes||[]).map(function(t){return'<span class="chip chip-theme">'+esc(t)+'</span>'}).join('')+'</div></div><div><strong>Characters</strong><div class="chips">'+(p.characters||[]).map(function(c){return'<span class="chip chip-character">'+esc(c)+'</span>'}).join('')+'</div></div><div><strong>Places</strong><div class="chips">'+(p.places||[]).map(function(p){return'<span class="chip chip-place">'+esc(p)+'</span>'}).join('')+'</div></div></div>'}).join('');document.getElementById('tagResults').style.display='block';document.getElementById('tagResultsContent').innerHTML=c;setStatus('Tag preview ready')}else showToast(r.error)}
async function applyTags(){var p=selected('inbox');if(!p.length)return showToast('Select one or more brain dumps first');startTimer('Tagging '+p.length+' brain dump(s)');var r=await call('tag_files',p,false);stopTimer();if(r.ok){showToast('Tagged '+r.tagged.length+' file(s)');await load();renderInbox()}else showToast(r.error)}
function renderManuscript(){var files=DATA.files.filter(function(f){return['chapters','drafts','final'].includes(f.folder)});var order=['craft','voice','characters','continuity','themes','editor','repetition','pacing','structure','memoir','reader','research','cadence','motifs','anchors','voice_dna','reader_perception'];var groups={};order.forEach(function(k){if(DATA.tools[k]){var g=DATA.tools[k].group||'Other';if(!groups[g])groups[g]=[];groups[g].push(k)}});var tg=Object.entries(groups).map(function(e){var group=e[0],keys=e[1];return'<div style="margin-bottom:16px"><strong>'+group+'</strong><div class="tool-grid" style="margin-top:8px">'+keys.map(function(k){var t=DATA.tools[k],c=(DATA.catalog||{})[k]||{};return'<div class="tool-card" id="tool-'+k+'" onclick="toggleTool(\''+k+'\')"><input type="checkbox" class="toolbox" value="'+k+'" onchange="event.stopPropagation();this.closest(\'.tool-card\').classList.toggle(\'selected\',this.checked)"><div class="tool-body"><div class="tool-title">'+esc(t.title)+'</div><div class="tool-meta">'+esc(c.stage||'draft')+' · '+esc(t.purpose||'')+'</div></div></div>'}).join('')+'</div></div>'}).join('');document.getElementById('content').innerHTML='<div class="view active zone-manuscript"><div class="view-header"><h1>Manuscript</h1><p class="lead">Chapters and drafts. This is the only material analysis touches.</p></div><div class="dropzone" onclick="importFiles(\'chapters\')"><div class="dropzone-icon">📂</div><div class="dropzone-text">Drop .txt or .md files here</div><div class="dropzone-hint">or click to browse</div></div><div class="card"><h3>Your manuscript</h3><div class="filelist" id="msList">'+renderFileList(files,'analysis')+'</div></div><div class="card"><h3>Choose analysis tools</h3><div class="actions"><button class="btn-secondary btn-sm" onclick="selectRecommended()">Use recommended</button><button class="btn-ghost btn-sm" onclick="selectAllTools()">Select all</button><button class="btn-ghost btn-sm" onclick="clearTools()">Clear</button></div>'+tg+'</div><div class="actions"><button class="btn-primary" onclick="runAnalysis()">Run selected</button></div><div id="analysisResults"></div></div>';var dz=document.querySelector('.dropzone');dz.ondragover=function(e){e.preventDefault();dz.classList.add('dragover')};dz.ondragleave=function(){dz.classList.remove('dragover')};dz.ondrop=async function(e){e.preventDefault();dz.classList.remove('dragover');var paths=[].slice.call(e.dataTransfer.files).map(function(f){return f.path});if(paths.length)await doImport('chapters',paths)}}
function toggleTool(k){var c=document.getElementById('tool-'+k);var cb=c.querySelector('input');cb.checked=!cb.checked;c.classList.toggle('selected',cb.checked)}
function selectRecommended(){clearTools();['craft','voice','characters','continuity','themes','editor','repetition','pacing','cadence'].forEach(function(k){var cb=document.querySelector('.toolbox[value="'+k+'"]');if(cb){cb.checked=true;cb.closest('.tool-card').classList.add('selected')}})}
function selectAllTools(){document.querySelectorAll('.toolbox').forEach(function(cb){cb.checked=true;cb.closest('.tool-card').classList.add('selected')})}
function clearTools(){document.querySelectorAll('.toolbox').forEach(function(cb){cb.checked=false;cb.closest('.tool-card').classList.remove('selected')})}
async function runAnalysis(){var p=selected('analysis');var t=[].slice.call(document.querySelectorAll('.toolbox:checked')).map(function(x){return x.value});if(!p.length)return showToast('Select one or more manuscript files first');if(!t.length)return showToast('Choose at least one analysis tool');startTimer('Analysing '+p.length+' file(s) with '+t.length+' tool(s)');var r=await call('analyze',p,t);stopTimer();if(r.ok){var html=r.results.flatMap(function(r){return Object.entries(r.results).map(function(e){return renderResult(r.filename,e[0],e[1])})}).join('')||'<div class="empty">No results returned.</div>';document.getElementById('analysisResults').innerHTML=html;setStatus(r.message)}else showToast(r.error)}
function renderResult(file,tool,data){var title=(DATA.tools[tool]||{}).title||tool;if(data.error)return'<div class="result-card"><div class="result-head"><div><h3>'+esc(file)+'</h3><div class="muted">'+esc(title)+'</div></div><span class="result-badge">error</span></div><p class="muted">'+esc(data.error)+'</p></div>';var items=prettyResult(data);return'<div class="result-card"><div class="result-head"><div><h3>'+esc(file)+'</h3><div class="muted">'+esc(title)+'</div></div><span class="result-badge">saved</span></div>'+(data.summary?'<div class="notice">'+esc(data.summary)+'</div>':'')+(data.strengths?'<div class="finding"><strong>Strengths</strong>'+data.strengths.map(function(s){return'<div>• '+esc(s)+'</div>'}).join('')+'</div>':'')+(data.observations?data.observations.slice(0,5).map(function(o){return'<div class="finding"><strong>'+esc((o.category||'').replace(/_/g,' '))+'</strong>'+esc(o.formatted||o.observation||'')+'</div>'}).join('')+'<details><summary>Full evidence (JSON)</summary><div class="json-viewer">'+esc(JSON.stringify(data,null,2))+'</div></details></div>':'')}
function prettyResult(data){var flat=[];function walk(v,path){if(v==null)return;if(Array.isArray(v)){if(v.length&&typeof v[0]==='object')flat.push({label:path,value:v});return}if(typeof v==='object'){for(var k in v){if(k==='analysis'||k==='observations'||k==='strengths'||k==='summary')continue;walk(v[k],path?path+' · '+k:k)}}else flat.push({label:path,value:v})}walk(data);return flat.slice(0,15)}
function renderSearch(){document.getElementById('content').innerHTML='<div class="view active"><div class="view-header"><h1>Search</h1><p class="lead">Find every scene mentioning a character, place, or theme.</p></div><div class="card"><h3>Search by tag</h3><div class="grid-2"><div><label class="muted">Tag type</label><select id="searchTagType" class="note-title-input" onchange="loadTagValues()"><option value="characters">Character</option><option value="places">Place</option><option value="themes">Theme</option><option value="era">Era</option><option value="emotional_register">Emotional Register</option><option value="status">Status</option></select></div><div><label class="muted">Value</label><input type="text" id="searchValue" class="note-title-input" placeholder="Type a value" list="tagValueList"></div></div><datalist id="tagValueList"></datalist><div class="actions"><button class="btn-primary" onclick="runSearch()">Search</button></div></div><div id="searchResults"></div></div>';loadTagValues()}
async function loadTagValues(){var tt=document.getElementById('searchTagType').value;try{var r=await call('get_tag_values',tt);document.getElementById('tagValueList').innerHTML=(r.values||[]).map(function(v){return'<option value="'+esc(v.value)+'">'+esc(v.value)+' ('+v.count+')</option>'}).join('')}catch(e){}}
async function runSearch(){var tt=document.getElementById('searchTagType').value;var v=document.getElementById('searchValue').value.trim();if(!v)return showToast('Enter a value to search for');startTimer('Searching for '+v);var r=await call('search_tags',tt,v);stopTimer();if(r.ok){var html=r.results.length?r.results.map(function(f){return'<div class="result-card"><div class="result-head"><div><h3>'+esc(f.filename||'unknown')+'</h3><div class="muted">'+(f.word_count||0)+' words · '+esc(f.status||'')+'</div></div></div>'+(f.characters&&f.characters.length?'<div><strong>Characters:</strong> '+f.characters.map(function(c){return'<span class="chip chip-character">'+esc(c)+'</span>'}).join('')+'</div>':'')+(f.themes&&f.themes.length?'<div><strong>Themes:</strong> '+f.themes.map(function(t){return'<span class="chip chip-theme">'+esc(t)+'</span>'}).join('')+'</div>':'')+'</div>'}).join(''):'<div class="empty">No files found.</div>';document.getElementById('searchResults').innerHTML=html;setStatus('Found '+r.count+' file(s)')}else showToast(r.error)}
function renderExports(){var files=DATA.files.filter(function(f){return['chapters','drafts','final'].includes(f.folder)});document.getElementById('content').innerHTML='<div class="view active"><div class="view-header"><h1>Export & Backup</h1><p class="lead">Outputs only. You choose where files land.</p></div><div class="card"><h3>Export one file</h3><div class="filelist">'+renderFileList(files,'export')+'</div><div class="actions" style="margin-top:12px"><button class="btn-secondary btn-sm" onclick="exportFile(\'docx\')">DOCX</button><button class="btn-secondary btn-sm" onclick="exportFile(\'md\')">Markdown</button><button class="btn-secondary btn-sm" onclick="exportFile(\'txt\')">Plain text</button></div></div><div class="card"><h3>Backup project</h3><p class="muted">Creates a ZIP with your writing folders and database.</p><button class="btn-primary" onclick="backupProject()">Choose location & create backup</button></div></div>'}
async function exportFile(kind){var p=selected('export');if(!p.length)return showToast('Select one file first');try{var sr=await call('pick_save_path','export.'+kind);if(!sr||!sr.path)return;startTimer('Exporting');var r=await call('export_file',p[0],kind,sr.path);stopTimer();if(r.ok)showToast('Export created: '+r.path);else showToast(r.error)}catch(e){showToast('Export cancelled')}}
async function backupProject(){try{var sr=await call('pick_save_path','Scribbler-Backup.zip');if(!sr||!sr.path)return;startTimer('Creating backup');var r=await call('backup_project',sr.path);stopTimer();if(r.ok)showToast('Backup created: '+r.path);else showToast(r.error)}catch(e){showToast('Backup cancelled')}}
function renderSettings(){document.getElementById('content').innerHTML='<div class="view active"><div class="view-header"><h1>Settings</h1><p class="lead">Optional AI configuration. All core analysis works without AI.</p></div><div class="card" id="settingsCard"><p class="muted">Loading…</p></div></div>';loadSettings()}
async function loadSettings(){try{var s=await call('get_ai_status');document.getElementById('settingsCard').innerHTML='<h3>AI Status</h3><p>'+esc(s.status)+'</p><div style="margin-top:16px"><strong>AI is optional.</strong> All 17 analysis tools and the tagger work fully without AI.</div>'}catch(e){document.getElementById('settingsCard').innerHTML='<p>Could not load settings.</p>'}}
function openQuickNote(){document.getElementById('noteOverlay').style.display='flex';document.getElementById('noteBody').focus()}
function closeQuickNote(){document.getElementById('noteOverlay').style.display='none';document.getElementById('noteTitle').value='';document.getElementById('noteBody').value=''}
async function saveNote(){var t=document.getElementById('noteTitle').value.trim();var tx=document.getElementById('noteBody').value.trim();if(!tx)return showToast('Write something first');var r=await call('save_note',t,tx);if(r.ok){closeQuickNote();showToast('Saved to Inbox');await load()}else showToast(r.error)}
async function deleteFile(path){if(!window.confirm('Move this file to archive? You can recover it later.'))return;var r=await call('delete_file',path);if(r.ok){showToast(r.message);await load();navigate(currentView)}else showToast(r.error)}
</script>
