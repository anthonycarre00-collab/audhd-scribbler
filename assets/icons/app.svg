<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="50%" stop-color="#1F1B17"/>
      <stop offset="100%" stop-color="#15120F"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0C896"/>
      <stop offset="40%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#A67B4E"/>
    </linearGradient>
    <linearGradient id="nibShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5D5A8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F5D5A8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE5B4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#D4A574" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with subtle gradient -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="#3A3530" stroke-width="1" opacity="0.5"/>

  <!-- Spark glow (behind spark) -->
  <circle cx="195" cy="55" r="35" fill="url(#sparkGlow)"/>

  <!-- Brain curve (upper portion) — represents the "messy but genius" mind -->
  <!-- Outer brain shape -->
  <path d="M 72 58
           Q 96 42 128 44
           Q 160 42 184 58
           Q 204 74 202 100
           Q 200 124 180 132
           Q 165 138 148 134
           Q 136 131 124 134
           Q 107 138 92 132
           Q 72 124 68 100
           Q 66 74 72 58 Z"
        fill="none" stroke="#8FB4A4" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- Brain folds (subtle, elegant) -->
  <path d="M 92 70 Q 100 64 108 72" fill="none" stroke="#8FB4A4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 118 62 Q 128 56 138 64" fill="none" stroke="#8FB4A4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 148 66 Q 158 60 168 70" fill="none" stroke="#8FB4A4" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 100 92 Q 112 86 122 96" fill="none" stroke="#8FB4A4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M 140 90 Q 152 84 162 94" fill="none" stroke="#8FB4A8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <path d="M 110 112 Q 124 108 134 116" fill="none" stroke="#8FB4A4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Fountain pen nib (lower portion) — represents the writing -->
  <!-- Nib body with gradient -->
  <path d="M 128 118
           L 148 178
           L 128 208
           L 108 178
           Z"
        fill="url(#penGrad)" stroke="#8B6539" stroke-width="1" stroke-linejoin="round" filter="url(#softShadow)"/>

  <!-- Nib shine (left side highlight) -->
  <path d="M 128 118
           L 115 165
           L 128 178
           Z"
        fill="url(#nibShine)" opacity="0.5"/>

  <!-- Nib slit (center groove) -->
  <line x1="128" y1="128" x2="128" y2="192" stroke="#1A1410" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nib breathing hole (the small circle on a fountain pen nib) -->
  <circle cx="128" cy="158" r="5" fill="#1A1410"/>
  <circle cx="128" cy="158" r="3" fill="#2A2018"/>

  <!-- Spark (the "genius" flash) — clean 4-point star -->
  <path d="M 195 42
           L 198 52
           L 208 55
           L 198 58
           L 195 68
           L 192 58
           L 182 55
           L 192 52
           Z"
        fill="#F0C896" opacity="0.95"/>
  <circle cx="195" cy="55" r="2.5" fill="#FFE5B4"/>

  <!-- Small accent dots (neural connections) -->
  <circle cx="84" cy="78" r="2" fill="#8FB4A4" opacity="0.5"/>
  <circle cx="172" cy="82" r="2" fill="#8FB4A4" opacity="0.5"/>
  <circle cx="100" cy="120" r="1.5" fill="#8FB4A4" opacity="0.4"/>
  <circle cx="156" cy="118" r="1.5" fill="#8FB4A4" opacity="0.4"/>
</svg>
