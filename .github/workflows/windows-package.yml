name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package dependencies and language model
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m spacy download en_core_web_sm

      - name: Build console-free executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ScribblerWindows --collect-all en_core_web_sm ScribblerWindows.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: iscc installer/windows.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Audhd-Scribbler-Windows
          path: installer/dist/Audhd-Scribbler-Windows-Installer.exe
