name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package dependencies and language model
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m spacy download en_core_web_sm
      - name: Run application smoke test before packaging
        shell: pwsh
        run: python smoke_test.py
      - name: Run functional tagging and analysis gate
        shell: pwsh
        run: python functional_smoke_test.py
      - name: Build console-free interactive executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ScribblerWindows --collect-all en_core_web_sm ScribblerWindows.py
      - name: Smoke test frozen executable startup
        shell: pwsh
        run: |
          $env:AUDHD_SCRIBBLER_HOME = "$env:RUNNER_TEMP\ScribblerSmokeProject"
          New-Item -ItemType Directory -Force -Path $env:AUDHD_SCRIBBLER_HOME | Out-Null
          $p = Start-Process -FilePath "dist\ScribblerWindows.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "Frozen ScribblerWindows.exe exited during startup (exit code $($p.ExitCode))."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "FROZEN EXECUTABLE STARTUP PASSED"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: iscc installer/windows.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Audhd-Scribbler-Windows
          path: installer/dist/Audhd-Scribbler-Windows-Installer.exe
