name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package dependencies and language model
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m spacy download en_core_web_sm
      - name: Run application smoke test before packaging
        shell: pwsh
        run: python smoke_test.py
      - name: Run functional tagging and analysis gate
        shell: pwsh
        run: python functional_smoke_test.py
      - name: Build console-free interactive executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ScribblerWindows --collect-all en_core_web_sm ScribblerWindows.py
      - name: Smoke test frozen executable startup and HTTP workspace
        shell: pwsh
        run: |
          $env:AUDHD_SCRIBBLER_HOME = "$env:RUNNER_TEMP\ScribblerSmokeProject"
          New-Item -ItemType Directory -Force -Path $env:AUDHD_SCRIBBLER_HOME | Out-Null
          $status = Join-Path $env:LOCALAPPDATA "Audhd Scribbler\startup-status.txt"
          Remove-Item $status -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\ScribblerWindows.exe" -PassThru
          $url = $null
          for ($i=0; $i -lt 20; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $status) {
              $line = Get-Content $status | Where-Object { $_ -like "URL:*" } | Select-Object -First 1
              if ($line) { $url = $line.Substring(4).Trim(); break }
            }
            if ($p.HasExited) { break }
          }
          if ($p.HasExited) { throw "Frozen ScribblerWindows.exe exited during startup (exit code $($p.ExitCode))." }
          if (-not $url) { throw "Frozen executable did not publish a startup URL/status file." }
          $r = Invoke-WebRequest -Uri ($url + "api/status") -UseBasicParsing -TimeoutSec 5
          if ($r.StatusCode -ne 200) { throw "Frozen HTTP workspace returned HTTP $($r.StatusCode)." }
          $r2 = Invoke-WebRequest -Uri ($url + "api/tools") -UseBasicParsing -TimeoutSec 5
          if ($r2.StatusCode -ne 200) { throw "Frozen tools endpoint returned HTTP $($r2.StatusCode)." }
          Stop-Process -Id $p.Id -Force
          Write-Host "FROZEN EXECUTABLE AND HTTP WORKSPACE PASSED"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: iscc installer/windows.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Audhd-Scribbler-Windows
          path: installer/dist/Audhd-Scribbler-Windows-Installer.exe
