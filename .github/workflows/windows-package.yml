name: Windows package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m spacy download en_core_web_sm
      - name: Run smoke test
        shell: pwsh
        run: python smoke_test.py
      - name: Run functional smoke test
        shell: pwsh
        run: python functional_smoke_test.py
      - name: Build v2 desktop app with PyInstaller
        shell: pwsh
        run: pyinstaller build/scribbler.spec --noconfirm --clean
      - name: Verify exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\AudhdScribbler\AudhdScribbler.exe")) {
            throw "Build failed: AudhdScribbler.exe not found"
          }
          Write-Host "v2 desktop exe built successfully"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: iscc build/windows.iss
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: Audhd-Scribbler-Portable
          path: dist/AudhdScribbler/
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Audhd-Scribbler-Installer
          path: dist/Audhd-Scribbler-Setup.exe
